name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python:
    name: Python MCP and tools
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.12.7"

      - name: Install locked workspace
        run: uv sync --locked --all-packages

      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q

      - name: Build MCP distributions
        run: uv build --package monika-mcp --no-sources

  build:
    name: Build ${{ matrix.configuration }} x64
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Build
        run: msbuild MoniKa.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /p:TreatWarningAsError=true

      - name: Verify executable metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "x64/${{ matrix.configuration }}/MoniKa.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Build output not found: $exe"
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem -Path "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          $headers = & $dumpbin /headers $exe | Out-String
          if ($headers -notmatch "subsystem \(Windows GUI\)") {
            throw "Executable is not using the Windows GUI subsystem"
          }
          $mt = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          $manifest = Join-Path $env:RUNNER_TEMP "MoniKa.manifest.xml"
          & $mt -nologo "-inputresource:$exe;#1" "-out:$manifest"
          $manifestText = Get-Content -Raw -LiteralPath $manifest
          if ($manifestText -notmatch 'requestedExecutionLevel level="asInvoker"') {
            throw "Embedded asInvoker manifest was not found"
          }

      - name: Verify README symlink
        shell: pwsh
        run: |
          $entry = git ls-files -s README.md
          if ($entry -notmatch '^120000 ') {
            throw "README.md must be stored as a Git symbolic link"
          }
          if ((git cat-file -p (($entry -split '\s+')[1])) -ne 'README.ko.md') {
            throw "README.md must point to README.ko.md"
          }

      - name: Upload executable
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MoniKa-windows-x64
          path: x64/Release/MoniKa.exe
          if-no-files-found: error
