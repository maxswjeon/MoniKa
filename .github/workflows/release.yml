name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate:
    name: Validate release
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Release tag must be a semantic version beginning with v: $tag"
          }
          "version=$($tag.Substring(1))" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

          $pyproject = Get-Content -Raw -LiteralPath "mcp/pyproject.toml"
          if ($pyproject -notmatch '(?m)^version\s*=\s*"([^"]+)"\s*$') {
            throw "Could not read the monika-mcp version"
          }
          if ($Matches[1] -ne $tag.Substring(1)) {
            throw "Release tag version $($tag.Substring(1)) does not match monika-mcp version $($Matches[1])"
          }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Build
        run: msbuild MoniKa.sln /m /p:Configuration=Release /p:Platform=x64 /p:TreatWarningAsError=true

      - name: Verify executable metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "x64/Release/MoniKa.exe"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem -Path "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          $headers = & $dumpbin /headers $exe | Out-String
          if ($headers -notmatch "subsystem \(Windows GUI\)") {
            throw "Executable is not using the Windows GUI subsystem"
          }
          $manifest = Join-Path $env:RUNNER_TEMP "MoniKa.manifest.xml"
          $mt = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $mt -nologo "-inputresource:$exe;#1" "-out:$manifest"
          if ((Get-Content -Raw -LiteralPath $manifest) -notmatch 'requestedExecutionLevel level="asInvoker"') {
            throw "Embedded asInvoker manifest was not found"
          }

      - name: Package
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $name = "MoniKa-$env:VERSION-windows-x64"
          $root = Join-Path "dist" $name
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item -LiteralPath "x64/Release/MoniKa.exe", "README.ko.md", "README.en.md", "DISCLAIMER.md", "LICENSE" -Destination $root
          $archive = Join-Path "dist" "$name.zip"
          Compress-Archive -Path $root -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          Set-Content -NoNewline -Encoding ascii -LiteralPath "$archive.sha256" -Value "$hash  $name.zip"
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$archive.sha256" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MoniKa-${{ steps.version.outputs.version }}-windows-x64
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error

  python-package:
    name: Build Python distributions
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          version: "0.12.7"

      - name: Build distributions
        run: uv build --package monika-mcp --no-sources

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monika-mcp-dist
          path: dist/*
          if-no-files-found: error

  pypi-publish:
    name: Publish monika-mcp to PyPI
    needs:
      - validate
      - python-package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/monika-mcp
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: monika-mcp-dist
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Publish GitHub release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.validate.outputs.tag }}" dist/* --repo "${{ github.repository }}" --title "MoniKa ${{ needs.validate.outputs.version }}" --generate-notes
