[project]
name = "monika-tooling"
version = "0.1.0"
description = "Development and dump-analysis tooling for MoniKa"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "numpy>=2",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.12",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["mcp"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["x64"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["mcp/tests"]
